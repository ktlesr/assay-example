name: Assay

on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ktlesr/assay@v1
        with:
          suite: assay.suite.yaml
          skill: ./skills/hello-manifest
          baseline: false
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
