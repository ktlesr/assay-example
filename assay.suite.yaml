version: 1

target:
  skill: hello-manifest
  source: assay-example@skills/hello-manifest

environment:
  host: claude-code
  model: claude-haiku-4-5-20251001
  system_prompt_hash: not-provided-by-host
  active_skills: [hello-manifest]

runs: 2

cases:
  - id: trigger.positive.explicit
    prompt: |
      Here is my dashboard draft:

      # Sales
      - revenue tile
      - churn tile

      Turn this into a widget manifest.
    expect: { triggered: true }

  - id: trigger.negative.near_neighbor.readme
    prompt: |
      Here is my dashboard draft:

      # Sales
      - revenue tile
      - churn tile

      Turn this into a README section.
    expect: { triggered: false }

  - id: complete.writes_manifest
    prompt: |
      Here is my dashboard draft:

      # Sales
      - revenue tile
      - churn tile

      Turn this into a widget manifest.
    expect:
      triggered: true
      assertions:
        - { type: file_exists, path: 'out/manifest.json' }
        - { type: file_valid, format: json }
        - type: json_schema
          path: 'out/manifest.json'
          schema:
            type: object
            required: [title, widgets]
            properties:
              title: { type: string }
              widgets:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [id, type, title]
        - { type: trace, rule: no_swallowed_errors }
